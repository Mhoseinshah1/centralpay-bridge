# Gitleaks configuration.
#
# Default rules stay fully enabled. A full-history scan (unlike CI's
# push-diff scans, and unlike any scan actually run between the first
# release attempt and a later manual `release.yml` dispatch that finally
# re-exercised this path) flags deliberate dummy credentials the test
# suite defines to PROVE redaction works. Every allowlisted value is
# self-evidently a placeholder by its own naming convention — a real
# credential would never match any of these specific shapes. Nothing else
# is allowlisted — in particular, no application, deployment, or
# documentation path, and no `paths`-based allowlisting (every entry must
# stand on the value's shape alone, auditable independent of location).

title = "centralpay-bridge"

[extend]
useDefault = true

[allowlist]
description = "Dummy fixture constants in the test suite, by self-evidently-fake value shape; used by the redaction tests themselves"
regexTarget = "line"
regexes = [
  # TEST_* env-style constants, e.g. TEST_INBOUND_API_KEY = "test-...".
  '''TEST_[A-Z0-9_]+ = "(test-[a-z0-9-]+|1234567890:TEST-[A-Za-z0-9-]+)"''',
  # Other established dummy-value prefixes used across the test suite for
  # secrets that are neither TEST_*-named nor env-style assignments (a
  # monkeypatch.setenv call, an attribute comparison, a function kwarg):
  # "alias-secret-..." (callback-secret-alias tests) and
  # "attacker-guessed-key-..." (auth-failure log-redaction test).
  '''"(alias-secret|attacker-guessed-key)-[a-z0-9-]+"''',
]
