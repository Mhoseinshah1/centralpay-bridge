name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Tests (Python, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: centralpay
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: centralpay_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U centralpay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # The backup/restore integration tests need pg_dump/pg_restore whose
      # major version matches the postgres:16 service (the tools abort on a
      # server newer than themselves; ubuntu-22.04 runners default to client
      # 14). Installing a matching client via apt/PGDG depends on external
      # package-index network access, which repeatedly hung this step; the
      # service container already ships version-matched client binaries, so
      # run those directly via `docker exec` instead of installing anything.
      # See .github/scripts/pg-client-wrapper.sh and
      # tests/integration/test_backup_restore.py::_find_pg_tool.
      - name: Set up PostgreSQL 16 client tools (service container, no apt/PGDG)
        env:
          POSTGRES_SERVICE_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          bindir="${RUNNER_TEMP}/pg16-bin"
          mkdir -p "$bindir"
          install -m 755 .github/scripts/pg-client-wrapper.sh "$bindir/pg_dump"
          ln -s pg_dump "$bindir/pg_restore"
          echo "$bindir" >> "$GITHUB_PATH"
          echo "POSTGRES_SERVICE_CONTAINER=${POSTGRES_SERVICE_CONTAINER}" >> "$GITHUB_ENV"
          "$bindir/pg_dump" --version
          "$bindir/pg_restore" --version
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: mypy
        run: mypy app tests
      - name: pytest (unit + PostgreSQL integration)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://centralpay:ci_test_password@localhost:5432/centralpay_test
        run: pytest -q

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          bash -n install.sh
          bash -n scripts/centralpay
          bash -n scripts/backup.sh
          bash -n scripts/render-caddy-config.sh
          bash -n .github/scripts/pg-client-wrapper.sh
          bash -n .github/scripts/trivy-scan.sh
      - name: ShellCheck
        run: shellcheck install.sh scripts/centralpay scripts/backup.sh scripts/render-caddy-config.sh .github/scripts/pg-client-wrapper.sh .github/scripts/trivy-scan.sh

  docker:
    name: Docker build and compose validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: |
          mkdir -p /tmp/cfg
          echo dummy > /tmp/cfg/db_password
          touch /tmp/cfg/centralpay.env /tmp/cfg/Caddyfile
          CENTRALPAY_ENV_FILE=/tmp/cfg/centralpay.env \
          CENTRALPAY_DB_PASSWORD_FILE=/tmp/cfg/db_password \
          CENTRALPAY_CADDYFILE=/tmp/cfg/Caddyfile \
            docker compose config --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Resolve APP_VERSION
        id: appver
        run: |
          echo "value=$(python3 -c 'from app.version import APP_VERSION; print(APP_VERSION)')" >> "$GITHUB_OUTPUT"
          # Daily cache-bust for the Dockerfile's apt security-refresh layer
          # (see Dockerfile's `base` stage): without this, GHA layer caching
          # below would silently reuse the same unrefreshed layer forever
          # after the first successful build. Daily (not per-run) keeps the
          # actual apt-get cost paid once per day rather than on every build.
          echo "apt_cachebust=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Build image (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: centralpay-bridge:ci
          build-args: |
            APP_VERSION=${{ steps.appver.outputs.value }}
            APT_REFRESH_CACHEBUST=${{ steps.appver.outputs.apt_cachebust }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image smoke test (non-root, version, label, static assets, clean exit)
        run: |
          docker run --rm --entrypoint python centralpay-bridge:ci - <<'EOF'
          import os
          from pathlib import Path
          import app as app_pkg
          from app.version import APP_VERSION
          assert os.getuid() != 0, "container must not run as root"
          # The wheel must ship the bundled font (see pyproject
          # tool.setuptools.package-data): a missing app/static previously
          # crashed StaticFiles at startup in production.
          fonts = Path(app_pkg.__file__).parent / "static" / "fonts" / "vazirmatn-v33"
          woff2 = fonts / "vazirmatn-variable.woff2"
          assert woff2.is_file(), "vazirmatn-variable.woff2 missing from image"
          assert (fonts / "OFL.txt").is_file(), "OFL.txt missing from image"
          assert woff2.read_bytes()[:4] == b"wOF2", "not a real WOFF2 payload"
          from starlette.staticfiles import StaticFiles
          StaticFiles(directory=fonts.parent.parent)  # validates the mount dir
          print("version:", APP_VERSION)
          print("static font assets present; StaticFiles mount directory valid")
          EOF
          label=$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.version" }}' centralpay-bridge:ci)
          expected='${{ steps.appver.outputs.value }}'
          echo "image version label: '${label}' (expected '${expected}')"
          test "$label" = "$expected"
      - name: Trivy vulnerability scan (image)
        # Catches this class of issue (CVE-2026-14456, a base-image OpenSSL
        # package one Debian security point-release behind its own fix) on
        # every pull request, before it can ever reach a release tag --
        # v0.6.0-rc3 only found it at release time because this job had no
        # such scan yet. Runs the exact same script, same digest-pinned
        # Trivy image, and same fail-closed policy as release.yml's own
        # scan (.github/scripts/trivy-scan.sh is the single source of truth
        # for both) so the two workflows' vulnerability gate cannot diverge.
        run: bash .github/scripts/trivy-scan.sh centralpay-bridge:ci
      - name: Validate Caddyfile template
        run: |
          sed -e 's/{{PAYMENT_DOMAIN}}/pay.example.com/' -e 's/{{TLS_EMAIL}}/ops@example.com/' \
            deploy/caddy/Caddyfile.template > /tmp/Caddyfile
          docker run --rm -v /tmp/Caddyfile:/etc/caddy/Caddyfile:ro caddy:2 \
            caddy validate --config /etc/caddy/Caddyfile
      # Production incident this proves fixed, end-to-end, against the real
      # caddy:2 image: an old, already-installed Caddyfile (URI-only
      # redaction, no Referer redaction -- the exact historical gap) must
      # be safely upgraded by scripts/render-caddy-config.sh to the
      # current template's mandatory directives, with the operator's
      # domain/TLS email preserved and the result genuinely valid
      # Caddyfile syntax -- never just a hand-copied string check.
      - name: Caddy config upgrade path (render-caddy-config.sh, real caddy:2)
        run: |
          mkdir -p /tmp/caddycfg
          cat > /tmp/caddycfg/Caddyfile <<'EOF'
          {
          	email old@example.com
          	admin off
          }

          old.example.com {
          	encode gzip
          	log {
          		output stdout
          		format filter {
          			wrap json
          			fields {
          				request>uri query {
          					replace sig REDACTED
          					replace ct REDACTED
          				}
          			}
          		}
          	}
          	header {
          		Strict-Transport-Security "max-age=31536000; includeSubDomains"
          	}
          	request_body {
          		max_size 64KB
          	}
          	@public {
          		path /api/custom-payment /api/centralpay/callback /health/live /health/ready /static/*
          	}
          	handle @public {
          		reverse_proxy api:8000
          	}
          	handle {
          		respond "Not found" 404
          	}
          }
          EOF
          # render-caddy-config.sh's own exit codes are a deliberate 3-way
          # contract (0 unchanged / 2 changed / 1 error), not a plain
          # success/failure boolean -- `|| rc=$?` captures it instead of
          # letting the job's `set -e` abort on the expected "2 = changed"
          # exit here.
          rc=0
          CENTRALPAY_INSTALL_DIR="$PWD" CENTRALPAY_CONFIG_DIR=/tmp/caddycfg \
            bash scripts/render-caddy-config.sh || rc=$?
          test "$rc" -eq 2 || { echo "FAIL: expected exit 2 (changed) upgrading an old config, got ${rc}"; exit 1; }
          grep -q 'headers>Referer regexp' /tmp/caddycfg/Caddyfile \
            || { echo "FAIL: upgraded Caddyfile is missing mandatory Referer redaction"; exit 1; }
          grep -q 'old.example.com {' /tmp/caddycfg/Caddyfile \
            || { echo "FAIL: operator domain was not preserved"; exit 1; }
          grep -q 'email old@example.com' /tmp/caddycfg/Caddyfile \
            || { echo "FAIL: operator TLS email was not preserved"; exit 1; }
          test -f /tmp/caddycfg/Caddyfile.bak.* \
            || { echo "FAIL: no backup of the pre-upgrade Caddyfile was created"; exit 1; }
          # A rerun BEFORE activation is confirmed must still report "needs
          # restart" (2), never a false "unchanged" -- the durable
          # activation-marker fix (crash/interrupt between replace and
          # restart must not be silently treated as already-active).
          rc=0
          CENTRALPAY_INSTALL_DIR="$PWD" CENTRALPAY_CONFIG_DIR=/tmp/caddycfg \
            bash scripts/render-caddy-config.sh || rc=$?
          test "$rc" -eq 2 || { echo "FAIL: expected exit 2 (activation unconfirmed) before --confirm-active, got ${rc}"; exit 1; }
          test "$(ls /tmp/caddycfg/Caddyfile.bak.* | wc -l)" -eq 1  # no second backup: content was already correct
          # Simulate the caller's post-restart step, THEN idempotency: a
          # rerun after activation is confirmed must be a pure no-op (exit
          # 0, byte-identical file, no additional backup).
          CENTRALPAY_CONFIG_DIR=/tmp/caddycfg bash scripts/render-caddy-config.sh --confirm-active
          cp /tmp/caddycfg/Caddyfile /tmp/caddycfg/Caddyfile.after-first-run
          rc=0
          CENTRALPAY_INSTALL_DIR="$PWD" CENTRALPAY_CONFIG_DIR=/tmp/caddycfg \
            bash scripts/render-caddy-config.sh || rc=$?
          test "$rc" -eq 0 || { echo "FAIL: expected exit 0 (unchanged, confirmed active) on the idempotent rerun, got ${rc}"; exit 1; }
          diff -q /tmp/caddycfg/Caddyfile.after-first-run /tmp/caddycfg/Caddyfile
          test "$(ls /tmp/caddycfg/Caddyfile.bak.* | wc -l)" -eq 1
          echo "PASS: old Caddyfile safely upgraded, validated by real caddy:2, idempotent once activation is confirmed"
      # Real-runtime proof (not just a text/config check): ct/sig must never
      # reach Caddy's emitted access log, including via the Referer header a
      # subsequent /static/* request carries (the callback page's own URL,
      # ct/sig included). Only the site address and upstream handler are
      # adapted for this job (no real ACME/DNS or live api:8000 here) -- the
      # log { ... } block under test is the actual rendered template output
      # from the step above, untouched, so this proves the real production
      # filter, not a hand-copied duplicate.
      - name: Verify ct/sig never leak into Caddy access logs (Referer header)
        run: |
          cp /tmp/Caddyfile /tmp/Caddyfile.referer-check
          python3 - <<'EOF'
          import re
          path = "/tmp/Caddyfile.referer-check"
          text = open(path).read()
          text = text.replace("pay.example.com {", ":8080 {")
          text = re.sub(r'reverse_proxy api:8000 \{.*?\n\t\t\}', 'respond "upstream-ok" 200', text, flags=re.S)
          open(path, "w").write(text)
          EOF
          docker run -d --name caddy-referer-check -p 18080:8080 \
            -v /tmp/Caddyfile.referer-check:/etc/caddy/Caddyfile:ro caddy:2
          trap 'docker logs caddy-referer-check; docker rm -f caddy-referer-check' EXIT

          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null "http://127.0.0.1:18080/health/live" 2>/dev/null && break
            sleep 1
          done

          REAL_CT="REAL_SECRET_CT_$(date +%s%N)"
          REAL_SIG="REAL_SECRET_SIG_$(date +%s%N)"

          curl -fsS -o /dev/null \
            "http://127.0.0.1:18080/api/centralpay/callback?orderId=1&ct=${REAL_CT}&sig=${REAL_SIG}"
          curl -fsS -o /dev/null \
            -H "Referer: https://pay.example.com/api/centralpay/callback?orderId=1&ct=${REAL_CT}&sig=${REAL_SIG}" \
            "http://127.0.0.1:18080/static/fonts/x.woff2"
          sleep 1

          LOGS=$(docker logs caddy-referer-check 2>&1)
          echo "$LOGS" | grep -q "REDACTED" || {
            echo "FAIL: REDACTED never appeared -- redaction did not fire at all"; exit 1; }
          echo "$LOGS" | grep -q "$REAL_CT" && {
            echo "FAIL: real ct value leaked into the Caddy access log"; exit 1; }
          echo "$LOGS" | grep -q "$REAL_SIG" && {
            echo "FAIL: real sig value leaked into the Caddy access log"; exit 1; }
          echo "PASS: ct/sig never appear in the Caddy access log (request URI or Referer)"

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    # gitleaks-action lists the PR's commits through the API on pull_request
    # events; on a private repository that needs pull-requests: read, which
    # the workflow-level token (contents: read only) does not carry.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit
        run: |
          pip install .
          pip install pip-audit
          pip-audit
